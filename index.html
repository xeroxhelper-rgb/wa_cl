<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>QR 스캔 → MS Forms 전송</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12151A">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="QR전송">
<meta name="mobile-web-app-capable" content="yes">

<style>
  :root{
    --ink:#12151A;
    --paper:#F6F3ED;
    --accent:#FF5A2A;
    --accent-ink:#3A1200;
    --ok:#2F9E44;
    --line:#E3DED3;
    --mono: 'SFMono-Regular', ui-monospace, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Malgun Gothic", sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    font-family:var(--sans); background:var(--ink); color:var(--ink);
    -webkit-tap-highlight-color:transparent;
  }
  #app{
    display:flex; flex-direction:column;
    height:100vh; height:100dvh;
  }

  /* ---------- 상단: 카메라 스캔 영역 ---------- */
  #scan-section{
    position:relative;
    flex:0 0 38%;
    background:#000;
    overflow:hidden;
  }
  #reader{ width:100%; height:100%; }
  #reader video{ width:100%!important; height:100%!important; object-fit:cover; }
  /* html5-qrcode가 그리는 기본 UI 숨김 */
  #reader img{ display:none!important; }
  #reader__dashboard{ display:none!important; }

  .frame-overlay{
    position:absolute; inset:0; pointer-events:none;
    display:flex; align-items:center; justify-content:center;
  }
  .frame-box{
    position:relative; width:62%; aspect-ratio:1/1; max-height:80%;
  }
  .frame-box .corner{
    position:absolute; width:28px; height:28px;
    border-color:#fff; transition:border-color .15s ease;
  }
  .frame-box.found .corner{ border-color:var(--ok); }
  .corner.tl{ top:0; left:0; border-top:4px solid; border-left:4px solid; }
  .corner.tr{ top:0; right:0; border-top:4px solid; border-right:4px solid; }
  .corner.bl{ bottom:0; left:0; border-bottom:4px solid; border-left:4px solid; }
  .corner.br{ bottom:0; right:0; border-bottom:4px solid; border-right:4px solid; }

  .scan-hint{
    position:absolute; top:10px; left:0; right:0;
    text-align:center; color:#fff; font-size:12px; letter-spacing:.06em;
    text-transform:uppercase; opacity:.75; font-weight:600;
  }

  /* ---------- 하단: 입력 영역 ---------- */
  #input-section{
    flex:1 1 auto;
    background:var(--paper);
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; gap:10px;
  }

  .label-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .label-row .label{ margin:0; }
  #today-date{ font-size:12px; font-weight:600; color:#8A8371; }

  .label{
    font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    color:#8A8371; margin:0 0 4px 2px;
  }
  .label.label-lg{
    font-size:16px; font-weight:700; letter-spacing:0; text-transform:none;
    color:var(--ink); margin:0 0 6px 2px;
  }

  #scanned-block{
    position:sticky; top:0; z-index:5;
    background:var(--paper);
    padding-top:2px; padding-bottom:4px;
  }

  #scanned-card{
    border:1.5px solid var(--line); background:#fff; border-radius:10px;
    padding:10px 12px; display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  #scanned-card.filled{ border-color:var(--ok); background:#F1FAF3; }
  #scanned-value{
    font-family:var(--mono); font-size:15px; font-weight:600; color:var(--ink);
    word-break:break-all; line-height:1.3;
  }
  #scanned-value.placeholder{ color:#B4AD9C; font-family:var(--sans); font-weight:500; font-size:14px; }
  #clear-scan{
    flex:0 0 auto; border:none; background:none; color:#B4AD9C; font-size:20px;
    line-height:1; padding:4px 6px; cursor:pointer;
  }
  #scanned-card.filled #clear-scan{ color:#7CBE8A; }

  #quantity-fields{ display:flex; flex-direction:column; gap:10px; }

  .qty-group-header{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px; }
  .qty-group-header .label{ margin:0; }

  .tab-switch{ flex:0 0 auto; display:flex; gap:4px; background:#EDE8DC; border-radius:999px; padding:3px; }
  .tab-btn{
    border:none; background:transparent; color:#8A8371; font-size:12px; font-weight:700;
    padding:5px 10px; border-radius:999px; cursor:pointer; white-space:nowrap;
  }
  .tab-btn.active{ background:var(--ink); color:#fff; }

  .buttons-row{
    display:flex; gap:7px; overflow-x:auto; -webkit-overflow-scrolling:touch;
    padding:2px 2px 4px;
  }
  .quick-btn{
    flex:0 0 auto; width:42px; height:42px; padding:0;
    border:1.5px solid var(--line); background:#fff; color:var(--ink);
    border-radius:50%; font-size:15px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; user-select:none;
  }
  .quick-btn.selected{ background:var(--ink); border-color:var(--ink); color:#fff; }

  #text-input{
    width:100%; border:1.5px solid var(--line); background:#fff; border-radius:10px;
    padding:10px 12px; font-size:15px; font-family:var(--sans); color:var(--ink);
  }
  #text-input:focus{ outline:none; border-color:var(--ink); }

  .spacer{ flex:1 1 auto; }

  #action-row{ display:flex; gap:8px; }

  #submit-btn{
    flex:1 1 auto; border:none; border-radius:12px;
    background:var(--accent); color:#fff; font-size:16px; font-weight:700;
    padding:13px; cursor:pointer; letter-spacing:.01em;
    transition:opacity .15s ease, transform .1s ease;
  }
  #submit-btn:active{ transform:scale(.98); }
  #submit-btn:disabled{ background:#D8D2C4; color:#A39C89; cursor:not-allowed; }

  #rescan-btn{
    flex:0 0 110px; border:1.5px solid var(--line); background:transparent;
    color:var(--ink); font-size:14px; font-weight:600; padding:9px 6px; border-radius:12px;
    cursor:pointer;
  }

  #toast{
    position:fixed; left:16px; right:16px; bottom:calc(16px + env(safe-area-inset-bottom));
    background:var(--ink); color:#fff; padding:12px 16px; border-radius:10px;
    font-size:14px; text-align:center; opacity:0; pointer-events:none;
    transform:translateY(8px); transition:opacity .2s ease, transform .2s ease;
    z-index:50;
  }
  #toast.show{ opacity:1; transform:translateY(0); }

  #config-warning{
    display:none; background:#FFF1E8; border:1.5px solid var(--accent); color:var(--accent-ink);
    border-radius:10px; padding:10px 12px; font-size:12.5px; line-height:1.5;
  }

  .modal-overlay{
    position:fixed; inset:0; background:rgba(18,21,26,.55);
    display:none; align-items:center; justify-content:center; z-index:200; padding:24px;
  }
  .modal-overlay.show{ display:flex; }
  .modal-card{
    background:#fff; border-radius:14px; padding:22px 20px; max-width:320px; width:100%;
    text-align:center;
  }
  .modal-title{ font-size:16px; font-weight:700; color:var(--ink); margin-bottom:8px; }
  .modal-body{ font-size:14px; color:#5B5647; line-height:1.5; margin-bottom:18px; }
  .modal-confirm-btn{
    width:100%; border:none; border-radius:10px; background:var(--accent); color:#fff;
    font-size:15px; font-weight:700; padding:12px; cursor:pointer;
  }
</style>
</head>
<body>
<div id="app">

  <div id="scan-section">
    <div id="reader"></div>
    <div class="frame-overlay">
      <div class="scan-hint">QR 코드를 프레임 안에 맞춰주세요</div>
      <div class="frame-box" id="frame-box">
        <div class="corner tl"></div><div class="corner tr"></div>
        <div class="corner bl"></div><div class="corner br"></div>
      </div>
    </div>
  </div>

  <div id="input-section">

    <div id="config-warning">
      ⚠️ MS Forms 전송 URL이 아직 설정되지 않았습니다. index.html 상단의 <b>CONFIG.MS_FORMS_TEMPLATE_URL</b> 값을 README 안내에 따라 채워주세요.
    </div>

    <div id="scanned-block">
      <div class="label-row">
        <div class="label">스캔된 값</div>
        <span id="today-date"></span>
      </div>
      <div id="scanned-card">
        <span id="scanned-value" class="placeholder">QR 코드를 스캔하세요</span>
        <button id="clear-scan" title="지우기">✕</button>
      </div>
    </div>

    <div id="quantity-fields"></div>

    <div>
      <div class="label">비고 입력 (선택)</div>
      <input id="text-input" type="text" placeholder="메모나 특이사항을 입력하세요" />
    </div>

    <div class="spacer"></div>

    <div id="action-row">
      <button id="rescan-btn" type="button">다시 스캔</button>
      <button id="submit-btn" type="button" disabled>MS Forms로 전송</button>
    </div>

  </div>

</div>

<div id="toast"></div>

<div id="offline-modal" class="modal-overlay">
  <div class="modal-card">
    <div class="modal-title">인터넷 연결 필요</div>
    <div class="modal-body">인터넷에 연결되어 있지 않습니다.<br>인터넷이 되는 곳으로 이동한 후 확인을 눌러주세요.</div>
    <button id="offline-modal-confirm" type="button" class="modal-confirm-btn">확인</button>
  </div>
</div>

<script src="vendor/html5-qrcode.min.js"></script>
<script>
/* =========================================================
   설정 (CONFIG) — 이 블록만 수정하면 됩니다
   ========================================================= */
const CONFIG = {
  // 1) Microsoft Forms에서 "미리 채워진 링크(Get Pre-filled link)"로 생성한 URL을 붙여넣으세요.
  //    링크를 만들 때 각 문항에는 아래 PLACEHOLDER 문자열을 그대로 입력해서 생성하면,
  //    이 코드가 문항 파라미터명을 몰라도 문자열 치환만으로 값을 채울 수 있습니다.
  MS_FORMS_TEMPLATE_URL: "https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=hTfGPKK40UG8RH2Kj_o9bnwRZnTmg9hAjZ0tvYsLBy9UOUlHNEJHVFM1MlpOSzMxUVU0ODZGS1RRUC4u&r4a28f38cdf1f41f99e4864aaa9ee2ba8=QR_VALUE_HERE&&rbd4498299293499181f6d7490da14e96=ORDER_QTY_HERE&rdd4db81f726a452abe98d4b79795b3db=RECOVERY_QTY_HERE",

  PLACEHOLDER_QR: "QR_VALUE_HERE",
  PLACEHOLDER_TEXT: "TEXT_VALUE_HERE",

  // 2) 전송 후 MS Forms를 새 탭으로 열지(true), 현재 화면에서 이동할지(false) 선택.
  OPEN_IN_NEW_TAB: true,

  // 2-1) 안드로이드에서는 Chrome Custom Tab을 거치지 않고 실제 기본 브라우저로 강제 이동
  //      (Chrome Custom Tab이 MS Forms를 데스크톱형 레이아웃으로 렌더링하는 문제 회피용)
  FORCE_DEFAULT_BROWSER_ON_ANDROID: true,

  // 3) 탭으로 묶어 하나의 입력 공간에서 여러 항목을 전환하며 입력받는 그룹.
  //    각 tab의 값은 " / "로 이어붙여 하나의 MS Forms 문항(placeholder)에 전달됩니다.
  //    예) Toner=3, Drum=5 선택 시 → "3 / 5" 로 전달 (비어있는 항목은 "0"으로 처리)
  QUANTITY_TAB_GROUPS: [
    {
      key: "order",
      label: "소모품 주문 수량",
      placeholder: "ORDER_QTY_HERE",
      tabs: [
        { key: "tonerOrder", tabLabel: "Toner", max: 10 },
        { key: "drumOrder", tabLabel: "Drum", max: 10 }
      ]
    },
    {
      key: "recovery",
      label: "폐소모품 회수 수량",
      placeholder: "RECOVERY_QTY_HERE",
      tabs: [
        { key: "tonerRecovery", tabLabel: "Toner", max: 10 },
        { key: "drumRecovery", tabLabel: "Drum", max: 10 }
      ]
    }
  ],

  // 4) 탭 없이 단독으로 표시되는 수량 항목 목록 (현재는 사용하는 항목 없음)
  QUANTITY_FIELDS: [],

  // 5) 위 수량 항목을 모두 선택해야 전송 버튼이 활성화되게 하려면 true
  REQUIRE_ALL_QUANTITIES: false
};
/* ========================================================= */

let scannedValue = "";
const quantityState = {};
let html5QrCode = null;
let isPaused = false;

const els = {
  scannedValue: document.getElementById('scanned-value'),
  scannedCard: document.getElementById('scanned-card'),
  quantityFields: document.getElementById('quantity-fields'),
  textInput: document.getElementById('text-input'),
  submitBtn: document.getElementById('submit-btn'),
  rescanBtn: document.getElementById('rescan-btn'),
  clearScan: document.getElementById('clear-scan'),
  frameBox: document.getElementById('frame-box'),
  toast: document.getElementById('toast'),
  configWarning: document.getElementById('config-warning'),
  offlineModal: document.getElementById('offline-modal'),
  offlineModalConfirm: document.getElementById('offline-modal-confirm'),
  todayDate: document.getElementById('today-date')
};

function showToast(msg, ms = 2200) {
  els.toast.textContent = msg;
  els.toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => els.toast.classList.remove('show'), ms);
}

function renderTodayDate() {
  const now = new Date();
  const days = ['일', '월', '화', '수', '목', '금', '토'];
  const y = now.getFullYear();
  const m = String(now.getMonth() + 1).padStart(2, '0');
  const d = String(now.getDate()).padStart(2, '0');
  els.todayDate.textContent = `${y}.${m}.${d} (${days[now.getDay()]})`;
}

function renderTabGroup(group) {
  group.tabs.forEach((t) => { quantityState[t.key] = ""; });
  let activeIndex = 0;

  const wrap = document.createElement('div');
  const header = document.createElement('div');
  header.className = 'qty-group-header';

  const label = document.createElement('div');
  label.className = 'label label-lg';
  label.textContent = group.label;

  const tabSwitch = document.createElement('div');
  tabSwitch.className = 'tab-switch';

  const row = document.createElement('div');
  row.className = 'buttons-row';

  function renderTabs() {
    tabSwitch.innerHTML = "";
    group.tabs.forEach((t, idx) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'tab-btn' + (idx === activeIndex ? ' active' : '');
      btn.textContent = quantityState[t.key] ? `${t.tabLabel} · ${quantityState[t.key]}` : t.tabLabel;
      btn.addEventListener('click', () => {
        activeIndex = idx;
        renderTabs();
        renderRow();
      });
      tabSwitch.appendChild(btn);
    });
  }

  function renderRow() {
    const tab = group.tabs[activeIndex];
    row.innerHTML = "";
    const max = tab.max || 10;
    for (let i = 1; i <= max; i++) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'quick-btn';
      btn.textContent = i;
      if (quantityState[tab.key] === String(i)) btn.classList.add('selected');
      btn.addEventListener('click', () => {
        const val = String(i);
        quantityState[tab.key] = (quantityState[tab.key] === val) ? "" : val;
        renderTabs();
        renderRow();
        updateSubmitState();
      });
      row.appendChild(btn);
    }
  }

  renderTabs();
  renderRow();

  header.appendChild(label);
  header.appendChild(tabSwitch);
  wrap.appendChild(header);
  wrap.appendChild(row);
  els.quantityFields.appendChild(wrap);
}

function renderSingleField(field) {
  quantityState[field.key] = "";

  const block = document.createElement('div');
  const label = document.createElement('div');
  label.className = 'label label-lg';
  label.textContent = field.label;

  const row = document.createElement('div');
  row.className = 'buttons-row';

  const max = field.max || 10;
  for (let i = 1; i <= max; i++) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'quick-btn';
    btn.textContent = i;
    btn.addEventListener('click', () => {
      const val = String(i);
      const isSame = quantityState[field.key] === val;
      quantityState[field.key] = isSame ? "" : val;
      [...row.children].forEach((c, idx) => c.classList.toggle('selected', !isSame && idx + 1 === i));
      updateSubmitState();
    });
    row.appendChild(btn);
  }

  block.appendChild(label);
  block.appendChild(row);
  els.quantityFields.appendChild(block);
}

function renderQuantityFields() {
  els.quantityFields.innerHTML = "";
  CONFIG.QUANTITY_TAB_GROUPS.forEach((group) => renderTabGroup(group));
  CONFIG.QUANTITY_FIELDS.forEach((field) => renderSingleField(field));
}

function allQuantityKeys() {
  const keys = CONFIG.QUANTITY_FIELDS.map((f) => f.key);
  CONFIG.QUANTITY_TAB_GROUPS.forEach((g) => g.tabs.forEach((t) => keys.push(t.key)));
  return keys;
}

function updateSubmitState() {
  const hasScan = !!scannedValue;
  const quantitiesOk = !CONFIG.REQUIRE_ALL_QUANTITIES ||
    allQuantityKeys().every((k) => !!quantityState[k]);
  els.submitBtn.disabled = !(hasScan && quantitiesOk);
}

function onScanSuccess(decodedText) {
  if (decodedText === scannedValue) return; // 동일 코드 중복 무시
  scannedValue = decodedText;
  els.scannedValue.textContent = decodedText;
  els.scannedValue.classList.remove('placeholder');
  els.scannedCard.classList.add('filled');
  els.frameBox.classList.add('found');
  if (navigator.vibrate) navigator.vibrate(80);
  updateSubmitState();
  pauseScanner();
}

function resetScanState() {
  scannedValue = "";
  els.scannedValue.textContent = "QR 코드를 스캔하세요";
  els.scannedValue.classList.add('placeholder');
  els.scannedCard.classList.remove('filled');
  els.frameBox.classList.remove('found');
  els.textInput.value = "";
  renderQuantityFields();
  updateSubmitState();
}

function pauseScanner() {
  if (html5QrCode && !isPaused) {
    try { html5QrCode.pause(true); isPaused = true; } catch (e) {}
  }
}

function resumeScanner() {
  if (html5QrCode && isPaused) {
    try { html5QrCode.resume(); isPaused = false; } catch (e) {}
  }
}

function startScanner() {
  html5QrCode = new Html5Qrcode("reader");
  html5QrCode.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: { width: 240, height: 240 }, aspectRatio: 1.0 },
    onScanSuccess,
    () => { /* 프레임마다 발생하는 인식 실패는 무시 */ }
  ).catch((err) => {
    showToast("카메라를 시작할 수 없습니다. 권한을 확인해주세요.", 4000);
    console.error(err);
  });
}

function buildFormsUrl() {
  const textVal = els.textInput.value || "";
  let url = CONFIG.MS_FORMS_TEMPLATE_URL;
  url = url.split(CONFIG.PLACEHOLDER_QR).join(encodeURIComponent(scannedValue));

  CONFIG.QUANTITY_FIELDS.forEach((f) => {
    url = url.split(f.placeholder).join(encodeURIComponent(quantityState[f.key] || ""));
  });

  CONFIG.QUANTITY_TAB_GROUPS.forEach((g) => {
    const combined = g.tabs.map((t) => quantityState[t.key] || "0").join(" / ");
    url = url.split(g.placeholder).join(encodeURIComponent(combined));
  });

  url = url.split(CONFIG.PLACEHOLDER_TEXT).join(encodeURIComponent(textVal));
  return url;
}

function isAndroid() {
  return /Android/i.test(navigator.userAgent);
}

function buildAndroidIntentUrl(httpsUrl) {
  const withoutScheme = httpsUrl.replace(/^https:\/\//, '');
  return 'intent://' + withoutScheme + '#Intent;scheme=https;action=android.intent.action.VIEW;end';
}

function isOnline() {
  return navigator.onLine;
}

function showOfflineModal() {
  els.offlineModal.classList.add('show');
}

function hideOfflineModal() {
  els.offlineModal.classList.remove('show');
}

function proceedToForms() {
  const url = buildFormsUrl();

  if (CONFIG.FORCE_DEFAULT_BROWSER_ON_ANDROID && isAndroid()) {
    window.location.href = buildAndroidIntentUrl(url);
  } else if (CONFIG.OPEN_IN_NEW_TAB) {
    window.open(url, '_blank');
  } else {
    window.location.href = url;
  }

  showToast("전송되었습니다. 폼 화면에서 제출을 눌러주세요.");
  resetScanState();
  resumeScanner();
}

function handleSubmit() {
  if (!scannedValue) return;
  if (!CONFIG.MS_FORMS_TEMPLATE_URL) {
    showToast("MS Forms URL이 설정되지 않았습니다 (README 참고)", 3500);
    return;
  }
  if (!isOnline()) {
    showOfflineModal();
    return;
  }
  proceedToForms();
}

els.submitBtn.addEventListener('click', handleSubmit);
els.rescanBtn.addEventListener('click', () => { resetScanState(); resumeScanner(); });
els.clearScan.addEventListener('click', () => { resetScanState(); resumeScanner(); });

els.offlineModalConfirm.addEventListener('click', () => {
  if (!isOnline()) {
    showToast("아직 인터넷에 연결되어 있지 않습니다.", 2000);
    return;
  }
  hideOfflineModal();
  proceedToForms();
});

// 새 탭에서 돌아왔을 때(iOS 등) 카메라가 멈춰 있으면 재개
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') resumeScanner();
});

window.addEventListener('load', () => {
  if (!CONFIG.MS_FORMS_TEMPLATE_URL) {
    els.configWarning.style.display = 'block';
  }
  renderTodayDate();
  setInterval(renderTodayDate, 60000);
  renderQuantityFields();
  updateSubmitState();
  startScanner();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
});
</script>
</body>
</html>
