<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>QR 스캔 → MS Forms 전송</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12151A">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="QR전송">
<meta name="mobile-web-app-capable" content="yes">

<style>
  :root{
    --ink:#12151A;
    --paper:#F6F3ED;
    --accent:#FF5A2A;
    --accent-ink:#3A1200;
    --ok:#2F9E44;
    --line:#E3DED3;
    --mono: 'SFMono-Regular', ui-monospace, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Malgun Gothic", sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    font-family:var(--sans); background:var(--ink); color:var(--ink);
    -webkit-tap-highlight-color:transparent;
  }
  #app{
    display:flex; flex-direction:column;
    height:100vh; height:100dvh;
  }

  /* ---------- 상단: 카메라 스캔 영역 ---------- */
  #scan-section{
    position:relative;
    flex:0 0 44%;
    background:#000;
    overflow:hidden;
  }
  #reader{ width:100%; height:100%; }
  #reader video{ width:100%!important; height:100%!important; object-fit:cover; }
  /* html5-qrcode가 그리는 기본 UI 숨김 */
  #reader img{ display:none!important; }
  #reader__dashboard{ display:none!important; }

  .frame-overlay{
    position:absolute; inset:0; pointer-events:none;
    display:flex; align-items:center; justify-content:center;
  }
  .frame-box{
    position:relative; width:62%; aspect-ratio:1/1; max-height:80%;
  }
  .frame-box .corner{
    position:absolute; width:28px; height:28px;
    border-color:#fff; transition:border-color .15s ease;
  }
  .frame-box.found .corner{ border-color:var(--ok); }
  .corner.tl{ top:0; left:0; border-top:4px solid; border-left:4px solid; }
  .corner.tr{ top:0; right:0; border-top:4px solid; border-right:4px solid; }
  .corner.bl{ bottom:0; left:0; border-bottom:4px solid; border-left:4px solid; }
  .corner.br{ bottom:0; right:0; border-bottom:4px solid; border-right:4px solid; }

  .scan-hint{
    position:absolute; top:10px; left:0; right:0;
    text-align:center; color:#fff; font-size:12px; letter-spacing:.06em;
    text-transform:uppercase; opacity:.75; font-weight:600;
  }

  /* ---------- 하단: 입력 영역 ---------- */
  #input-section{
    flex:1 1 auto;
    background:var(--paper);
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:14px 16px calc(14px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; gap:14px;
  }

  .label{
    font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    color:#8A8371; margin:0 0 6px 2px;
  }
  .label.label-lg{
    font-size:17px; font-weight:700; letter-spacing:0; text-transform:none;
    color:var(--ink); margin:0 0 8px 2px;
  }

  #scanned-card{
    border:1.5px solid var(--line); background:#fff; border-radius:10px;
    padding:12px 14px; display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  #scanned-card.filled{ border-color:var(--ok); background:#F1FAF3; }
  #scanned-value{
    font-family:var(--mono); font-size:15px; font-weight:600; color:var(--ink);
    word-break:break-all; line-height:1.3;
  }
  #scanned-value.placeholder{ color:#B4AD9C; font-family:var(--sans); font-weight:500; font-size:14px; }
  #clear-scan{
    flex:0 0 auto; border:none; background:none; color:#B4AD9C; font-size:20px;
    line-height:1; padding:4px 6px; cursor:pointer;
  }
  #scanned-card.filled #clear-scan{ color:#7CBE8A; }

  #buttons-row{
    display:flex; gap:8px; overflow-x:auto; -webkit-overflow-scrolling:touch;
    padding:2px 2px 6px;
  }
  .quick-btn{
    flex:0 0 auto; width:48px; height:48px; padding:0;
    border:1.5px solid var(--line); background:#fff; color:var(--ink);
    border-radius:50%; font-size:16px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; user-select:none;
  }
  .quick-btn.selected{ background:var(--ink); border-color:var(--ink); color:#fff; }

  #text-input{
    width:100%; border:1.5px solid var(--line); background:#fff; border-radius:10px;
    padding:12px 14px; font-size:15px; font-family:var(--sans); color:var(--ink);
  }
  #text-input:focus{ outline:none; border-color:var(--ink); }

  .spacer{ flex:1 1 auto; }

  #action-row{ display:flex; gap:8px; }

  #submit-btn{
    flex:1 1 auto; border:none; border-radius:12px;
    background:var(--accent); color:#fff; font-size:16px; font-weight:700;
    padding:16px; cursor:pointer; letter-spacing:.01em;
    transition:opacity .15s ease, transform .1s ease;
  }
  #submit-btn:active{ transform:scale(.98); }
  #submit-btn:disabled{ background:#D8D2C4; color:#A39C89; cursor:not-allowed; }

  #rescan-btn{
    flex:0 0 110px; border:1.5px solid var(--line); background:transparent;
    color:var(--ink); font-size:14px; font-weight:600; padding:11px 6px; border-radius:12px;
    cursor:pointer;
  }

  #toast{
    position:fixed; left:16px; right:16px; bottom:calc(16px + env(safe-area-inset-bottom));
    background:var(--ink); color:#fff; padding:12px 16px; border-radius:10px;
    font-size:14px; text-align:center; opacity:0; pointer-events:none;
    transform:translateY(8px); transition:opacity .2s ease, transform .2s ease;
    z-index:50;
  }
  #toast.show{ opacity:1; transform:translateY(0); }

  #config-warning{
    display:none; background:#FFF1E8; border:1.5px solid var(--accent); color:var(--accent-ink);
    border-radius:10px; padding:10px 12px; font-size:12.5px; line-height:1.5;
  }
</style>
</head>
<body>
<div id="app">

  <div id="scan-section">
    <div id="reader"></div>
    <div class="frame-overlay">
      <div class="scan-hint">QR 코드를 프레임 안에 맞춰주세요</div>
      <div class="frame-box" id="frame-box">
        <div class="corner tl"></div><div class="corner tr"></div>
        <div class="corner bl"></div><div class="corner br"></div>
      </div>
    </div>
  </div>

  <div id="input-section">

    <div id="config-warning">
      ⚠️ MS Forms 전송 URL이 아직 설정되지 않았습니다. index.html 상단의 <b>CONFIG.MS_FORMS_TEMPLATE_URL</b> 값을 README 안내에 따라 채워주세요.
    </div>

    <div>
      <div class="label">스캔된 값</div>
      <div id="scanned-card">
        <span id="scanned-value" class="placeholder">QR 코드를 스캔하세요</span>
        <button id="clear-scan" title="지우기">✕</button>
      </div>
    </div>

    <div>
      <div class="label label-lg">주문 수량</div>
      <div id="buttons-row"></div>
    </div>

    <div>
      <div class="label">비고 입력 (선택)1</div>
      <input id="text-input" type="text" placeholder="메모나 특이사항을 입력하세요" />
    </div>

    <div class="spacer"></div>

    <div id="action-row">
      <button id="rescan-btn" type="button">다시 스캔</button>
      <button id="submit-btn" type="button" disabled>MS Forms로 전송</button>
    </div>

  </div>

</div>

<div id="toast"></div>

<script src="vendor/html5-qrcode.min.js"></script>

<script>
/* =========================================================
   설정 (CONFIG) — 이 블록만 수정하면 됩니다
   ========================================================= */
const CONFIG = {
  // 1) Microsoft Forms에서 "미리 채워진 링크(Get Pre-filled link)"로 생성한 URL을 붙여넣으세요.
  //    링크를 만들 때 각 문항에는 아래 PLACEHOLDER 문자열을 그대로 입력해서 생성하면,
  //    이 코드가 문항 파라미터명을 몰라도 문자열 치환만으로 값을 채울 수 있습니다.
  //    예) https://forms.office.com/pages/responsepage.aspx?id=xxxxxxxx&r1234=QR_VALUE_HERE&r5678=BUTTON_VALUE_HERE&r9012=TEXT_VALUE_HERE
  MS_FORMS_TEMPLATE_URL: "https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=hTfGPKK40UG8RH2Kj_o9bnwRZnTmg9hAjZ0tvYsLBy9UOUlHNEJHVFM1MlpOSzMxUVU0ODZGS1RRUC4u&r4a28f38cdf1f41f99e4864aaa9ee2ba8=QR_VALUE_HERE&&rbd4498299293499181f6d7490da14e96=TEXT_VALUE_HERE&rdd4db81f726a452abe98d4b79795b3db=BUTTON_VALUE_HERE",

  PLACEHOLDER_QR: "QR_VALUE_HERE",
  PLACEHOLDER_BUTTON: "BUTTON_VALUE_HERE",
  PLACEHOLDER_TEXT: "TEXT_VALUE_HERE",

  // 2) 전송 후 MS Forms를 새 탭으로 열지(true), 현재 화면에서 이동할지(false) 선택.
  //    - true 추천: 스캐너 화면이 계속 살아있어 바로 다음 항목 스캔 가능 (Android에서 안정적)
  //    - iOS 홈화면 앱(standalone)에서는 새 탭이 Safari로 튈 수 있어 false가 더 자연스러울 수 있음
  OPEN_IN_NEW_TAB: false,

  // 안드로이드에서는 Chrome 대신 실제 기본 브라우저로 강제 이동
  FORCE_DEFAULT_BROWSER_ON_ANDROID: true,  

  // 3) 하단 "주문 수량" 버튼(가로 스크롤 칩) 목록 — label(화면 표시), value(폼에 전달될 값)
  //    기본값은 1~10을 자동 생성. 범위를 바꾸려면 10 대신 원하는 최대값을 넣으세요.
  QUICK_BUTTONS: Array.from({ length: 10 }, (_, i) => ({ label: String(i + 1), value: String(i + 1) })),

  // 4) 주문 수량 선택을 필수로 만들지 여부
  REQUIRE_BUTTON: false
};
/* ========================================================= */

let scannedValue = "";
let selectedButtonValue = "";
let html5QrCode = null;
let isPaused = false;

const els = {
  scannedValue: document.getElementById('scanned-value'),
  scannedCard: document.getElementById('scanned-card'),
  buttonsRow: document.getElementById('buttons-row'),
  textInput: document.getElementById('text-input'),
  submitBtn: document.getElementById('submit-btn'),
  rescanBtn: document.getElementById('rescan-btn'),
  clearScan: document.getElementById('clear-scan'),
  frameBox: document.getElementById('frame-box'),
  toast: document.getElementById('toast'),
  configWarning: document.getElementById('config-warning')
};

function showToast(msg, ms = 2200) {
  els.toast.textContent = msg;
  els.toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => els.toast.classList.remove('show'), ms);
}

function renderButtons() {
  els.buttonsRow.innerHTML = "";
  CONFIG.QUICK_BUTTONS.forEach((b) => {
    const el = document.createElement('button');
    el.type = "button";
    el.className = "quick-btn";
    el.textContent = b.label;
    el.addEventListener('click', () => {
      const isSame = selectedButtonValue === b.value;
      selectedButtonValue = isSame ? "" : b.value;
      [...els.buttonsRow.children].forEach(c => c.classList.remove('selected'));
      if (!isSame) el.classList.add('selected');
      updateSubmitState();
    });
    els.buttonsRow.appendChild(el);
  });
}

function updateSubmitState() {
  const hasScan = !!scannedValue;
  const hasButtonIfRequired = !CONFIG.REQUIRE_BUTTON || !!selectedButtonValue;
  els.submitBtn.disabled = !(hasScan && hasButtonIfRequired);
}

function onScanSuccess(decodedText) {
  if (decodedText === scannedValue) return; // 동일 코드 중복 무시
  scannedValue = decodedText;
  els.scannedValue.textContent = decodedText;
  els.scannedValue.classList.remove('placeholder');
  els.scannedCard.classList.add('filled');
  els.frameBox.classList.add('found');
  if (navigator.vibrate) navigator.vibrate(80);
  updateSubmitState();
  pauseScanner();
}

function resetScanState() {
  scannedValue = "";
  selectedButtonValue = "";
  els.scannedValue.textContent = "QR 코드를 스캔하세요";
  els.scannedValue.classList.add('placeholder');
  els.scannedCard.classList.remove('filled');
  els.frameBox.classList.remove('found');
  els.textInput.value = "";
  [...els.buttonsRow.children].forEach(c => c.classList.remove('selected'));
  updateSubmitState();
}

function pauseScanner() {
  if (html5QrCode && !isPaused) {
    try { html5QrCode.pause(true); isPaused = true; } catch (e) {}
  }
}

function resumeScanner() {
  if (html5QrCode && isPaused) {
    try { html5QrCode.resume(); isPaused = false; } catch (e) {}
  }
}

function startScanner() {
  html5QrCode = new Html5Qrcode("reader");
  html5QrCode.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: { width: 240, height: 240 }, aspectRatio: 1.0 },
    onScanSuccess,
    () => { /* 프레임마다 발생하는 인식 실패는 무시 */ }
  ).catch((err) => {
    showToast("카메라를 시작할 수 없습니다. 권한을 확인해주세요.", 4000);
    console.error(err);
  });
}

function buildFormsUrl() {
  const textVal = els.textInput.value || "";
  let url = CONFIG.MS_FORMS_TEMPLATE_URL;
  url = url.split(CONFIG.PLACEHOLDER_QR).join(encodeURIComponent(scannedValue));
  url = url.split(CONFIG.PLACEHOLDER_BUTTON).join(encodeURIComponent(selectedButtonValue));
  url = url.split(CONFIG.PLACEHOLDER_TEXT).join(encodeURIComponent(textVal));
  return url;
}

// 삼성 브라우저 기동을 위한 함수 2개 추가
function isAndroid() {
  return /Android/i.test(navigator.userAgent);
}

function buildAndroidIntentUrl(httpsUrl) {
  const withoutScheme = httpsUrl.replace(/^https:\/\//, '');
  return 'intent://' + withoutScheme + '#Intent;scheme=https;action=android.intent.action.VIEW;end';
}
/*
function handleSubmit() {
  if (!scannedValue) return;
  if (!CONFIG.MS_FORMS_TEMPLATE_URL) {
    showToast("MS Forms URL이 설정되지 않았습니다 (README 참고)", 3500);
    return;
  }
  const url = buildFormsUrl();
  if (CONFIG.OPEN_IN_NEW_TAB) {
    window.open(url, '_blank');
  } else {
    window.location.href = url;
  }
  showToast("전송되었습니다. 폼 화면에서 제출을 눌러주세요.");
  resetScanState();
  resumeScanner();
}
*/

//handleSubmit() 함수 교환
function handleSubmit() {
  if (!scannedValue) return;
  if (!CONFIG.MS_FORMS_TEMPLATE_URL) {
    showToast("MS Forms URL이 설정되지 않았습니다 (README 참고)", 3500);
    return;
  }
  const url = buildFormsUrl();

  if (CONFIG.FORCE_DEFAULT_BROWSER_ON_ANDROID && isAndroid()) {
    window.location.href = buildAndroidIntentUrl(url);
  } else if (CONFIG.OPEN_IN_NEW_TAB) {
    window.open(url, '_blank');
  } else {
    window.location.href = url;
  }

  showToast("전송되었습니다. 폼 화면에서 제출을 눌러주세요.");
  resetScanState();
  resumeScanner();
}

els.submitBtn.addEventListener('click', handleSubmit);
els.rescanBtn.addEventListener('click', () => { resetScanState(); resumeScanner(); });
els.clearScan.addEventListener('click', () => { resetScanState(); resumeScanner(); });

// 새 탭에서 돌아왔을 때(iOS 등) 카메라가 멈춰 있으면 재개
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') resumeScanner();
});

window.addEventListener('load', () => {
  if (!CONFIG.MS_FORMS_TEMPLATE_URL) {
    els.configWarning.style.display = 'block';
  }
  renderButtons();
  updateSubmitState();
  startScanner();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
});
</script>
</body>
</html>
